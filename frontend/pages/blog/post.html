<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Blog Post — Bali Telecommunications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>.post-content p{margin-bottom:1rem;color:#8BA4C8;line-height:1.8;}.post-content h2,.post-content h3{font-family:Syne,sans-serif;color:#E8F0FC;margin:1.5rem 0 0.75rem;font-weight:700;}.post-content ul{margin:1rem 0 1rem 1.5rem;list-style:disc;color:#8BA4C8;}.post-content li{margin-bottom:0.4rem;}</style>
</head>
<body class="network-bg">
<div id="nav-root"></div>

<article class="pt-28 pb-20">
  <div class="max-w-3xl mx-auto px-4 sm:px-6">
    <div id="post-loading" class="text-center py-20 text-[#8BA4C8]">Loading article...</div>
    <div id="post-content" class="hidden">
      <div class="mb-4"><a href="/pages/blog/index.html" class="text-[#4DA3FF] text-sm hover:underline">← Back to Blog</a></div>
      <div class="text-xs text-[#4DA3FF] font-semibold uppercase tracking-wider mb-3" id="post-category"></div>
      <h1 class="text-4xl font-extrabold text-white leading-tight mb-4" style="font-family:Syne,sans-serif;" id="post-title"></h1>
      <div class="flex items-center gap-4 text-xs text-[#8BA4C8] mb-8 pb-6 border-b border-white/10">
        <span id="post-author"></span>
        <span id="post-date"></span>
        <span id="post-views"></span>
      </div>
      <div class="post-content" id="post-body"></div>
      <!-- Tags -->
      <div class="mt-10 pt-6 border-t border-white/10">
        <div class="flex flex-wrap gap-2" id="post-tags"></div>
      </div>
      <!-- CTA -->
      <div class="mt-10 service-card p-8 text-center" style="background:linear-gradient(135deg,rgba(24,95,165,0.15),rgba(6,14,30,0.8))">
        <h3 class="text-xl font-bold text-white mb-2" style="font-family:Syne,sans-serif;">Ready to upgrade your connectivity?</h3>
        <p class="text-[#8BA4C8] text-sm mb-4">Our team can design the perfect telecom solution for your business.</p>
        <a href="/pages/contact.html" class="btn-primary">Get a Free Quote</a>
      </div>
    </div>
    <div id="post-error" class="hidden text-center py-20">
      <div class="text-6xl mb-4">📄</div>
      <h2 class="text-2xl font-bold text-white mb-2" style="font-family:Syne,sans-serif;">Article Not Found</h2>
      <p class="text-[#8BA4C8] mb-6">This article may have been moved or deleted.</p>
      <a href="/pages/blog/index.html" class="btn-primary">Back to Blog</a>
    </div>
  </div>
</article>

<div id="footer-root"></div>
<a id="whatsapp-btn" href="#" data-number="923001234567" target="_blank" aria-label="WhatsApp"></a>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('nav-root').innerHTML = components.getNavHTML('blog');
document.getElementById('footer-root').innerHTML = components.getFooterHTML();

var slug = new URLSearchParams(window.location.search).get('slug');
if (!slug) { showError(); } else { loadPost(); }

function showError() {
  document.getElementById('post-loading').classList.add('hidden');
  document.getElementById('post-error').classList.remove('hidden');
}

function loadPost() {
  api.get('/blog/' + slug).then(function(d) {
    var p = d.post;
    document.title = p.title + ' — Bali Telecommunications';
    document.getElementById('post-category').textContent = p.category || '';
    document.getElementById('post-title').textContent = p.title;
    document.getElementById('post-author').textContent = 'By ' + (p.author ? p.author.name : 'Bali Telecom Team');
    document.getElementById('post-date').textContent = p.published_at ? new Date(p.published_at).toLocaleDateString('en-PK', {year:'numeric',month:'long',day:'numeric'}) : '';
    document.getElementById('post-views').textContent = p.views + ' views';
    document.getElementById('post-body').innerHTML = p.content || '<p>' + p.excerpt + '</p>';
    var tags = p.tags || [];
    document.getElementById('post-tags').innerHTML = tags.map(function(t) {
      return '<span class="px-3 py-1 rounded-full border border-white/10 text-xs text-[#8BA4C8]">#'+t+'</span>';
    }).join('');
    document.getElementById('post-loading').classList.add('hidden');
    document.getElementById('post-content').classList.remove('hidden');
  }).catch(function() { showError(); });
}
</script>
</body>
</html>
