<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Invoices — Bali Telecom Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="network-bg min-h-screen">
<div class="flex min-h-screen">
  <aside class="w-64 bg-[#0A1628] border-r border-white/10 flex flex-col fixed h-full z-50">
    <div class="p-6 border-b border-white/10">
      <span class="font-bold text-white text-sm" style="font-family:Syne,sans-serif;">BaliTelecom Portal</span>
      <div class="mt-3 text-[#8BA4C8] text-xs" id="sidebar-name"></div>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="/pages/portal/dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all text-sm">Dashboard</a>
      <a href="/pages/portal/invoices.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-white/10 text-white text-sm">Invoices</a>
      <a href="/pages/portal/tickets.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all text-sm">Support Tickets</a>
    </nav>
    <div class="p-4 border-t border-white/10">
      <button id="logout-btn" class="w-full px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-red-400 text-sm text-left">Sign Out</button>
    </div>
  </aside>
  <main class="ml-64 flex-1 p-8">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold text-white mb-6" style="font-family:Syne,sans-serif;">My Invoices</h1>
      <div class="service-card overflow-hidden">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-white/10 text-left">
            <th class="px-6 py-4 text-[#8BA4C8] font-medium">Invoice No.</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Period</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Amount</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Due Date</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Status</th>
          </tr></thead>
          <tbody id="invoices-table"><tr><td colspan="5" class="text-center py-8 text-[#8BA4C8]">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.requireAuth()) { throw 0; }
var user = auth.getUser();
document.getElementById('sidebar-name').textContent = user.name;
document.getElementById('logout-btn').addEventListener('click', auth.logout);
var sc = {paid:'status-up',unpaid:'status-warning',overdue:'status-down'};
api.get('/invoices/my').then(function(d){
  document.getElementById('invoices-table').innerHTML = d.invoices.length ? d.invoices.map(function(inv){
    return '<tr class="border-b border-white/5 hover:bg-white/2">' +
      '<td class="px-6 py-4 text-white font-medium">' + inv.invoice_no + '</td>' +
      '<td class="px-4 py-4 text-[#8BA4C8]">' + (inv.period_start||'-') + '</td>' +
      '<td class="px-4 py-4 text-white">RM' + parseFloat(inv.total_amount).toFixed(2) + '</td>' +
      '<td class="px-4 py-4 text-[#8BA4C8]">' + (inv.due_date||'-') + '</td>' +
      '<td class="px-4 py-4"><span class="status-badge ' + (sc[inv.status]||'status-warning') + ' text-xs capitalize">' + inv.status + '</span></td>' +
      '</tr>';
  }).join('') : '<tr><td colspan="5" class="text-center py-8 text-[#8BA4C8]">No invoices found.</td></tr>';
}).catch(function(){
  document.getElementById('invoices-table').innerHTML = '<tr><td colspan="5" class="text-center py-8 text-[#8BA4C8]">Failed to load invoices.</td></tr>';
});
</script>
</body>
</html>
