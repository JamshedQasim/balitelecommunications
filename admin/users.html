<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Users — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="network-bg min-h-screen">
<div class="flex min-h-screen">
  <aside class="w-64 bg-[#05090F] border-r border-white/10 flex flex-col fixed h-full z-50">
    <div class="p-6 border-b border-white/10"><div class="text-white font-bold text-sm" style="font-family:Syne,sans-serif;">BaliTelecom <span class="text-red-400 text-xs">ADMIN</span></div></div>
    <nav class="flex-1 p-4 space-y-1 text-sm">
      <a href="/admin/index.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">Dashboard</a>
      <a href="/admin/leads.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">Leads</a>
      <a href="/admin/tickets.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">Tickets</a>
      <a href="/admin/users.html" class="block px-4 py-2.5 rounded-lg bg-white/10 text-white">Users</a>
      <a href="/admin/invoices.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">Invoices</a>
      <a href="/admin/blog.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">Blog Posts</a>
    </nav>
    <div class="p-4 border-t border-white/10"><button id="logout-btn" class="w-full px-4 py-2.5 text-[#8BA4C8] hover:text-red-400 text-sm text-left">Sign Out</button></div>
  </aside>
  <main class="ml-64 flex-1 p-8">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-2xl font-bold text-white mb-6" style="font-family:Syne,sans-serif;">User Management</h1>
      <div class="service-card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-white/10 text-left">
            <th class="px-5 py-4 text-[#8BA4C8] font-medium">Name</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Email</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Company</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Role</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Status</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Joined</th>
          </tr></thead>
          <tbody id="users-table"><tr><td colspan="6" class="text-center py-8 text-[#8BA4C8]">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.isAdmin()) { window.location.href = '/pages/portal/login.html'; }
document.getElementById('logout-btn').addEventListener('click', auth.logout);
api.get('/admin/users').then(function(d) {
  document.getElementById('users-table').innerHTML = d.users.map(function(u) {
    var dt = new Date(u.created_at).toLocaleDateString('en-MY');
    return '<tr class="border-b border-white/5 hover:bg-white/2">' +
      '<td class="px-5 py-3 text-white font-medium">'+u.name+'</td>' +
      '<td class="px-4 py-3 text-[#8BA4C8] text-xs">'+u.email+'</td>' +
      '<td class="px-4 py-3 text-[#8BA4C8] text-xs">'+(u.company||'-')+'</td>' +
      '<td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded-full border '+(u.role==='admin'?'border-red-500/40 text-red-400':'border-blue-500/40 text-blue-400')+'">'+ u.role+'</span></td>' +
      '<td class="px-4 py-3"><span class="text-xs '+(u.is_active?'text-green-400':'text-red-400')+'">'+(u.is_active?'Active':'Inactive')+'</span></td>' +
      '<td class="px-4 py-3 text-[#8BA4C8] text-xs">'+dt+'</td>' +
      '</tr>';
  }).join('');
}).catch(function() {
  document.getElementById('users-table').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-red-400">Failed to load.</td></tr>';
});
</script>
</body>
</html>
