    .admin-table th{padding:12px 16px;font-size:11px;font-weight:600;color:#8BA4C8;text-align:left;border-bottom:1px solid rgba(255,255,255,0.07);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;}
    .admin-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
    .admin-table tr:last-child td{border-bottom:none;}
    .admin-table tr:hover td{background:rgba(255,255,255,0.015);}

</head>

<aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-[#05090F] border-r border-white/10 flex flex-col z-50 -translate-x-full lg:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10 flex items-center gap-3">
    <div class="w-9 h-9 bg-gradient-to-br from-[#185FA5] to-[#2580E8] rounded-xl flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/></svg>
    </div>
    <div><div class="text-white font-bold text-sm" style="font-family:Syne,sans-serif;">BaliTelecom</div><div class="text-red-400 text-xs font-bold tracking-widest">ADMIN</div></div>
  </div>
  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
    <a href="/admin/index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>Dashboard</a>
    <a href="/admin/leads.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/></svg>Leads</a>
    <a href="/admin/tickets.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>Tickets</a>
    <a href="/admin/users.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Users</a>
    <a href="/admin/invoices.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Invoices</a>
    <a href="/admin/blog.html" class="nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Blog Posts</a>
  </nav>
  <div class="p-3 border-t border-white/10 space-y-0.5">
    <a href="/pages/index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>View Site</a>
    <button id="logout-btn" class="nav-item w-full text-left hover:text-red-400 hover:bg-red-500/5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</button>
  </div>
</aside>

<div class="lg:ml-64 flex flex-col min-h-screen">
  <header class="sticky top-0 z-30 bg-[#05090F]/95 backdrop-blur-sm border-b border-white/10 px-4 sm:px-6 py-3 flex items-center gap-3">
    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div>
      <h1 class="text-white font-bold text-base sm:text-lg" style="font-family:Syne,sans-serif;">Blog Posts</h1>
      <p class="text-[#8BA4C8] text-xs hidden sm:block">Create and manage knowledge hub articles</p>
    </div>
  </header>

  <main class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-5xl mx-auto space-y-6">

      <!-- New post form -->
      <div class="service-card p-5 sm:p-6">
        <h2 class="font-bold text-white mb-5 flex items-center gap-2" style="font-family:Syne,sans-serif;">
          <svg class="w-4 h-4 text-[#4DA3FF]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Create New Post
        </h2>
        <div id="blog-alert" class="form-alert mb-4" style="display:none"></div>
        <div class="grid sm:grid-cols-2 gap-4 mb-4">
          <div><label class="form-label">Title *</label><input id="b-title" class="form-input" placeholder="Post title" required/></div>
          <div><label class="form-label">Category</label><input id="b-cat" class="form-input" placeholder="e.g. Enterprise"/></div>
        </div>
        <div class="mb-4"><label class="form-label">Slug <span class="text-[#8BA4C8] font-normal">(auto-generated if empty)</span></label><input id="b-slug" class="form-input" placeholder="my-post-slug"/></div>
        <div class="mb-4"><label class="form-label">Excerpt</label><textarea id="b-excerpt" class="form-input" rows="2" placeholder="Short description shown in blog listing..."></textarea></div>
        <div class="mb-5"><label class="form-label">Content <span class="text-[#8BA4C8] font-normal">(HTML supported)</span></label><textarea id="b-content" class="form-input font-mono text-xs" rows="8" placeholder="<p>Your content here...</p>&#10;<h2>Section heading</h2>&#10;<p>More content...</p>"></textarea></div>
        <div class="flex flex-col sm:flex-row gap-3">
          <button onclick="createPost(false)" class="btn-outline text-sm py-2.5 px-6 flex items-center gap-2 justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
            Save Draft
          </button>
          <button onclick="createPost(true)" class="btn-primary text-sm py-2.5 px-6 flex items-center gap-2 justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Publish Now
          </button>
        </div>
      </div>

      <!-- Post list desktop -->
      <div class="service-card overflow-hidden hidden sm:block">
        <div class="px-5 py-4 border-b border-white/5 flex items-center justify-between">
          <h2 class="font-bold text-white text-sm" style="font-family:Syne,sans-serif;">All Posts</h2>
          <span class="text-[#8BA4C8] text-xs" id="post-count"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="admin-table w-full">
            <thead><tr><th>Title / Slug</th><th>Category</th><th>Views</th><th>Status</th></tr></thead>
            <tbody id="blog-table"><tr><td colspan="4" class="text-center py-10 text-[#8BA4C8]">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Post list mobile -->
      <div class="sm:hidden space-y-3" id="blog-cards"><div class="service-card p-5 text-center text-[#8BA4C8] text-sm">Loading...</div></div>

    </div>
  </main>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.isAdmin()) { window.location.href = '/pages/portal/login.html'; }
document.getElementById('logout-btn').addEventListener('click', auth.logout);
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden');}

function slugify(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}

async function createPost(publish) {
  var title = document.getElementById('b-title').value.trim();
  var alertEl = document.getElementById('blog-alert');
  if (!title) { alertEl.className='alert alert-error'; alertEl.textContent='Title is required.'; alertEl.style.display='block'; return; }
  var slug = document.getElementById('b-slug').value.trim() || slugify(title)+'-'+Date.now();
  var body = { title, slug, category: document.getElementById('b-cat').value, excerpt: document.getElementById('b-excerpt').value, content: document.getElementById('b-content').value, is_published: publish };
  try {
    await api.post('/blog', body);
    alertEl.className='alert alert-success';
    alertEl.textContent='✓ Post '+(publish?'published successfully':'saved as draft')+'.';
    alertEl.style.display='block';
    ['b-title','b-slug','b-cat','b-excerpt','b-content'].forEach(function(id){ var el=document.getElementById(id); el.tagName==='TEXTAREA'?el.value='':el.value=''; });
    loadPosts();
  } catch(e) { alertEl.className='alert alert-error'; alertEl.textContent='✗ '+e.message; alertEl.style.display='block'; }
}

async function loadPosts() {
  try {
    var d = await api.get('/blog?limit=50');
    var posts = d.posts;
    document.getElementById('post-count').textContent = posts.length + ' posts';

    document.getElementById('blog-table').innerHTML = posts.length ? posts.map(function(p) {
      var badge = p.is_published
        ? '<span style="display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.1);color:#86efac;">Published</span>'
        : '<span style="display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fcd34d;">Draft</span>';
      return '<tr><td><div class="text-white font-medium text-sm">'+p.title+'</div><div class="text-[#8BA4C8] text-xs mt-0.5 font-mono">'+p.slug+'</div></td>' +
        '<td class="text-[#8BA4C8] text-xs">'+(p.category||'—')+'</td>' +
        '<td class="text-[#8BA4C8] text-xs">'+p.views+'</td>' +
        '<td>'+badge+'</td></tr>';
    }).join('') : '<tr><td colspan="4" class="text-center py-10 text-[#8BA4C8]">No posts yet.</td></tr>';

    document.getElementById('blog-cards').innerHTML = posts.length ? posts.map(function(p) {
      var badge = p.is_published
        ? '<span style="display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.1);color:#86efac;">Published</span>'
        : '<span style="display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fcd34d;">Draft</span>';
      return '<div class="service-card p-4 flex items-start gap-3">' +
        '<div class="flex-1 min-w-0">' +
          '<div class="flex items-start justify-between gap-2 mb-1">' +
            '<div class="text-white font-semibold text-sm truncate">'+p.title+'</div>' +
            badge +
          '</div>' +
          '<div class="text-[#8BA4C8] text-xs font-mono mb-1">'+p.slug+'</div>' +
          '<div class="flex items-center gap-3 text-xs text-[#8BA4C8]">' +
            '<span>'+(p.category||'—')+'</span>' +
            '<span>'+p.views+' views</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="service-card p-5 text-center text-[#8BA4C8] text-sm">No posts yet.</div>';
  } catch(e) {}
}
loadPosts();
</script>
</body>
</html>
