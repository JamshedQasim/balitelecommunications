<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Leads — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="network-bg min-h-screen">
<div class="flex min-h-screen">
  <aside class="w-64 bg-[#05090F] border-r border-white/10 flex flex-col fixed h-full z-50">
    <div class="p-6 border-b border-white/10"><div class="text-white font-bold text-sm" style="font-family:Syne,sans-serif;">BaliTelecom <span class="text-red-400 text-xs">ADMIN</span></div></div>
    <nav class="flex-1 p-4 space-y-1 text-sm">
      <a href="/admin/index.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all">Dashboard</a>
      <a href="/admin/leads.html" class="block px-4 py-2.5 rounded-lg bg-white/10 text-white">Leads</a>
      <a href="/admin/tickets.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all">Tickets</a>
      <a href="/admin/users.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all">Users</a>
      <a href="/admin/invoices.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all">Invoices</a>
      <a href="/admin/blog.html" class="block px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all">Blog Posts</a>
    </nav>
    <div class="p-4 border-t border-white/10"><button id="logout-btn" class="w-full px-4 py-2.5 text-[#8BA4C8] hover:text-red-400 text-sm text-left">Sign Out</button></div>
  </aside>
  <main class="ml-64 flex-1 p-8">
    <div class="max-w-6xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white" style="font-family:Syne,sans-serif;">Leads Management</h1>
        <select id="status-filter" class="form-input w-40 text-sm" onchange="loadLeads()">
          <option value="">All Leads</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="converted">Converted</option>
          <option value="lost">Lost</option>
        </select>
      </div>
      <div class="service-card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-white/10 text-left">
            <th class="px-5 py-4 text-[#8BA4C8] font-medium">Name / Company</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Contact</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Service</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Status</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Date</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Action</th>
          </tr></thead>
          <tbody id="leads-table"><tr><td colspan="6" class="text-center py-8 text-[#8BA4C8]">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.isAdmin()) { window.location.href = '/pages/portal/login.html'; }
document.getElementById('logout-btn').addEventListener('click', auth.logout);
var sc = {new:'bg-yellow-500/20 text-yellow-300 border-yellow-500/30',contacted:'bg-blue-500/20 text-blue-300 border-blue-500/30',converted:'bg-green-500/20 text-green-300 border-green-500/30',lost:'bg-red-500/20 text-red-300 border-red-500/30'};

async function loadLeads() {
  var status = document.getElementById('status-filter').value;
  var url = '/leads?limit=50' + (status ? '&status='+status : '');
  document.getElementById('leads-table').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-[#8BA4C8]">Loading...</td></tr>';
  try {
    var d = await api.get(url);
    document.getElementById('leads-table').innerHTML = d.leads.length ? d.leads.map(function(l) {
      var dt = new Date(l.created_at).toLocaleDateString('en-MY');
      return '<tr class="border-b border-white/5 hover:bg-white/2">' +
        '<td class="px-5 py-3"><div class="text-white font-medium">'+l.name+'</div><div class="text-[#8BA4C8] text-xs">'+(l.company||'-')+'</div></td>' +
        '<td class="px-4 py-3"><div class="text-[#8BA4C8] text-xs">'+l.email+'</div><div class="text-[#8BA4C8] text-xs">'+(l.phone||'-')+'</div></td>' +
        '<td class="px-4 py-3 text-[#8BA4C8] text-xs">'+(l.service_interest||'-')+'</td>' +
        '<td class="px-4 py-3"><span class="status-badge border text-xs '+(sc[l.status]||'')+' capitalize">'+l.status+'</span></td>' +
        '<td class="px-4 py-3 text-[#8BA4C8] text-xs">'+dt+'</td>' +
        '<td class="px-4 py-3"><select onchange="updateStatus('+l.id+', this.value)" class="text-xs bg-[#0D1F3C] border border-white/10 text-[#8BA4C8] rounded px-2 py-1"><option>new</option><option>contacted</option><option>converted</option><option>lost</option></select></td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="6" class="text-center py-8 text-[#8BA4C8]">No leads found.</td></tr>';
  } catch(e) { document.getElementById('leads-table').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-red-400">Failed to load.</td></tr>'; }
}

async function updateStatus(id, status) {
  try { await api.patch('/leads/'+id+'/status', {status}); loadLeads(); } catch(e) { alert('Failed: ' + e.message); }
}
loadLeads();
</script>
</body>
</html>
