<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Support Tickets — Bali Telecom Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="network-bg min-h-screen">
<div class="flex min-h-screen">
  <aside class="w-64 bg-[#0A1628] border-r border-white/10 flex flex-col fixed h-full z-50">
    <div class="p-6 border-b border-white/10">
      <span class="font-bold text-white text-sm" style="font-family:Syne,sans-serif;">BaliTelecom Portal</span>
      <div class="mt-3 text-[#8BA4C8] text-xs" id="sidebar-name"></div>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="/pages/portal/dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all text-sm">Dashboard</a>
      <a href="/pages/portal/invoices.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5 transition-all text-sm">Invoices</a>
      <a href="/pages/portal/tickets.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-white/10 text-white text-sm">Support Tickets</a>
    </nav>
    <div class="p-4 border-t border-white/10">
      <button id="logout-btn" class="w-full px-4 py-2.5 rounded-lg text-[#8BA4C8] hover:text-red-400 text-sm text-left">Sign Out</button>
    </div>
  </aside>
  <main class="ml-64 flex-1 p-8">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white" style="font-family:Syne,sans-serif;">Support Tickets</h1>
        <a href="/pages/support.html" class="btn-primary text-sm py-2">+ New Ticket</a>
      </div>
      <div class="service-card overflow-hidden">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-white/10 text-left">
            <th class="px-6 py-4 text-[#8BA4C8] font-medium">Subject</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Category</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Priority</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Status</th>
            <th class="px-4 py-4 text-[#8BA4C8] font-medium">Created</th>
          </tr></thead>
          <tbody id="tickets-table"><tr><td colspan="5" class="text-center py-8 text-[#8BA4C8]">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.requireAuth()) { throw 0; }
var user = auth.getUser();
document.getElementById('sidebar-name').textContent = user.name;
document.getElementById('logout-btn').addEventListener('click', auth.logout);
var pc = {low:'text-green-400',medium:'text-yellow-400',high:'text-orange-400',critical:'text-red-400'};
var sc2 = {open:'status-warning',in_progress:'status-warning',resolved:'status-up',closed:'status-up'};
api.get('/tickets/my').then(function(d){
  document.getElementById('tickets-table').innerHTML = d.tickets.length ? d.tickets.map(function(t){
    var dt = new Date(t.created_at).toLocaleDateString('en-PK');
    return '<tr class="border-b border-white/5 hover:bg-white/2">' +
      '<td class="px-6 py-4 text-white font-medium max-w-xs truncate">' + t.subject + '</td>' +
      '<td class="px-4 py-4 text-[#8BA4C8] capitalize">' + t.category + '</td>' +
      '<td class="px-4 py-4 ' + (pc[t.priority]||'text-gray-400') + ' font-medium capitalize">' + t.priority + '</td>' +
      '<td class="px-4 py-4"><span class="status-badge ' + (sc2[t.status]||'status-warning') + ' text-xs capitalize">' + t.status.replace('_',' ') + '</span></td>' +
      '<td class="px-4 py-4 text-[#8BA4C8]">' + dt + '</td>' +
      '</tr>';
  }).join('') : '<tr><td colspan="5" class="text-center py-8 text-[#8BA4C8]">No tickets yet. <a href="/pages/support.html" class="text-[#4DA3FF]">Submit a ticket</a></td></tr>';
}).catch(function(){
  document.getElementById('tickets-table').innerHTML = '<tr><td colspan="5" class="text-center py-8 text-[#8BA4C8]">Failed to load tickets.</td></tr>';
});
</script>
</body>
</html>
