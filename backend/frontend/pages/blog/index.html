<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Blog — Bali Telecommunications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="network-bg">
<div id="nav-root"></div>

<section class="pt-28 pb-12 text-center">
  <div class="max-w-3xl mx-auto px-4">
    <div class="section-tag">Knowledge Hub</div>
    <h1 class="text-5xl font-extrabold text-white mt-3" style="font-family:Syne,sans-serif;">Telecom <span class="gradient-text">Insights</span></h1>
    <p class="text-[#8BA4C8] mt-4">Expert articles on business connectivity, network technology, and enterprise IT.</p>
  </div>
</section>

<!-- Filter tabs -->
<section class="pb-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-wrap gap-2 justify-center" id="category-tabs">
      <button onclick="filterCategory('')" class="cat-btn px-4 py-2 rounded-full text-sm border border-[#185FA5] bg-[#185FA5] text-white transition-all" data-cat="">All</button>
      <button onclick="filterCategory('Education')" class="cat-btn px-4 py-2 rounded-full text-sm border border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white transition-all" data-cat="Education">Education</button>
      <button onclick="filterCategory('Enterprise')" class="cat-btn px-4 py-2 rounded-full text-sm border border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white transition-all" data-cat="Enterprise">Enterprise</button>
      <button onclick="filterCategory('VoIP')" class="cat-btn px-4 py-2 rounded-full text-sm border border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white transition-all" data-cat="VoIP">VoIP</button>
      <button onclick="filterCategory('Security')" class="cat-btn px-4 py-2 rounded-full text-sm border border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white transition-all" data-cat="Security">Security</button>
      <button onclick="filterCategory('Comparison')" class="cat-btn px-4 py-2 rounded-full text-sm border border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white transition-all" data-cat="Comparison">Comparison</button>
    </div>
  </div>
</section>

<section class="pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div id="blog-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="service-card p-6 animate-pulse h-48"></div>
      <div class="service-card p-6 animate-pulse h-48"></div>
      <div class="service-card p-6 animate-pulse h-48"></div>
    </div>
    <!-- Pagination -->
    <div id="pagination" class="flex justify-center gap-3 mt-10"></div>
  </div>
</section>

<div id="footer-root"></div>
<a id="whatsapp-btn" href="#" data-number="923373819147" target="_blank" aria-label="WhatsApp"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('nav-root').innerHTML = components.getNavHTML('blog');
document.getElementById('footer-root').innerHTML = components.getFooterHTML();

var currentPage = 1;
var currentCat = '';

function filterCategory(cat) {
  currentCat = cat;
  currentPage = 1;
  document.querySelectorAll('.cat-btn').forEach(function(b) {
    var active = b.dataset.cat === cat;
    b.className = 'cat-btn px-4 py-2 rounded-full text-sm border transition-all ' + (active ? 'border-[#185FA5] bg-[#185FA5] text-white' : 'border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white');
  });
  loadPosts();
}

function loadPosts() {
  var url = '/blog?page=' + currentPage + '&limit=9' + (currentCat ? '&category=' + encodeURIComponent(currentCat) : '');
  document.getElementById('blog-grid').innerHTML = '<div class="col-span-3 text-center py-12 text-[#8BA4C8]">Loading...</div>';
  api.get(url).then(function(d) {
    if (!d.posts.length) {
      document.getElementById('blog-grid').innerHTML = '<div class="col-span-3 text-center py-12 text-[#8BA4C8]">No articles found.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    document.getElementById('blog-grid').innerHTML = d.posts.map(function(p) {
      var date = p.published_at ? new Date(p.published_at).toLocaleDateString('en-PK', {year:'numeric',month:'long',day:'numeric'}) : '';
      return '<a href="/pages/blog/post.html?slug='+p.slug+'" class="service-card p-6 block group" data-reveal>' +
        '<div class="flex items-center justify-between mb-3"><span class="text-xs text-[#4DA3FF] font-semibold uppercase tracking-wider">'+p.category+'</span><span class="text-xs text-[#8BA4C8]">'+date+'</span></div>' +
        '<h3 class="font-bold text-white text-sm leading-snug mb-3 group-hover:text-[#4DA3FF] transition-colors" style="font-family:Syne,sans-serif;">'+p.title+'</h3>' +
        '<p class="text-[#8BA4C8] text-xs leading-relaxed mb-4 line-clamp-3">'+p.excerpt+'</p>' +
        '<div class="flex items-center justify-between"><span class="text-[#4DA3FF] text-xs font-medium">Read article →</span><span class="text-xs text-[#8BA4C8]">'+p.views+' views</span></div>' +
        '</a>';
    }).join('');

    // Pagination
    var pages = d.pages;
    var pg = '';
    for (var i = 1; i <= pages; i++) {
      var active = i === d.page;
      var p2 = i;
      pg += '<button onclick="goPage('+p2+')" class="w-9 h-9 rounded-lg text-sm font-semibold transition-all ' + (active ? 'bg-[#185FA5] text-white' : 'border border-white/10 text-[#8BA4C8] hover:border-[#185FA5] hover:text-white') + '">' + p2 + '</button>';
    }
    document.getElementById('pagination').innerHTML = pg;
  }).catch(function() {
    document.getElementById('blog-grid').innerHTML = '<div class="col-span-3 text-center py-12 text-[#8BA4C8]">Failed to load articles.</div>';
  });
}

function goPage(p) { currentPage = p; loadPosts(); window.scrollTo(0,0); }
loadPosts();
</script>
</body>
</html>
