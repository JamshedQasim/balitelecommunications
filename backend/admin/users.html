<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Users — Admin | BaliTelecom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#8BA4C8;font-size:14px;transition:all .15s;cursor:pointer;text-decoration:none;}
    .nav-item:hover{color:#fff;background:rgba(255,255,255,0.06);}
    .nav-item.active{color:#fff;background:rgba(24,95,165,0.35);border:1px solid rgba(24,95,165,0.3);}
    .nav-item svg{flex-shrink:0;width:16px;height:16px;}
    .admin-table th{padding:12px 16px;font-size:11px;font-weight:600;color:#8BA4C8;text-align:left;border-bottom:1px solid rgba(255,255,255,0.07);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;}
    .admin-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
    .admin-table tr:last-child td{border-bottom:none;}
    .admin-table tr:hover td{background:rgba(255,255,255,0.015);}
    .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
  </style>
</head>
<body class="network-bg min-h-screen">

<div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden" onclick="closeSidebar()"></div>

<aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-[#05090F] border-r border-white/10 flex flex-col z-50 -translate-x-full lg:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10 flex items-center gap-3">
    <div class="w-9 h-9 bg-gradient-to-br from-[#185FA5] to-[#2580E8] rounded-xl flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/></svg>
    </div>
    <div><div class="text-white font-bold text-sm" style="font-family:Syne,sans-serif;">BaliTelecom</div><div class="text-red-400 text-xs font-bold tracking-widest">ADMIN</div></div>
  </div>
  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
    <a href="/admin/index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>Dashboard</a>
    <a href="/admin/leads.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/></svg>Leads</a>
    <a href="/admin/tickets.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>Tickets</a>
    <a href="/admin/users.html" class="nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Users</a>
    <a href="/admin/invoices.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Invoices</a>
    <a href="/admin/blog.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Blog Posts</a>
  </nav>
  <div class="p-3 border-t border-white/10 space-y-0.5">
    <a href="/pages/index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>View Site</a>
    <button id="logout-btn" class="nav-item w-full text-left hover:text-red-400 hover:bg-red-500/5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</button>
  </div>
</aside>

<div class="lg:ml-64 flex flex-col min-h-screen">
  <header class="sticky top-0 z-30 bg-[#05090F]/95 backdrop-blur-sm border-b border-white/10 px-4 sm:px-6 py-3 flex items-center gap-3">
    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div>
      <h1 class="text-white font-bold text-base sm:text-lg" style="font-family:Syne,sans-serif;">User Management</h1>
      <p class="text-[#8BA4C8] text-xs hidden sm:block">All registered clients and admins</p>
    </div>
    <div class="ml-auto text-[#8BA4C8] text-xs" id="user-count"></div>
  </header>

  <main class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-5xl mx-auto space-y-4">

      <!-- Table desktop -->
      <div class="service-card overflow-hidden hidden sm:block">
        <div class="overflow-x-auto">
          <table class="admin-table w-full">
            <thead><tr><th>User</th><th>Email</th><th>Company</th><th>Role</th><th>Status</th><th>Joined</th></tr></thead>
            <tbody id="users-table"><tr><td colspan="6" class="text-center py-10 text-[#8BA4C8]">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Cards mobile -->
      <div class="sm:hidden space-y-3" id="user-cards"><div class="service-card p-5 text-center text-[#8BA4C8] text-sm">Loading...</div></div>

    </div>
  </main>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.isAdmin()) { window.location.href = '/pages/portal/login.html'; }
document.getElementById('logout-btn').addEventListener('click', auth.logout);
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden');}

function initials(name) { return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
var avatarColors = ['#185FA5','#2580E8','#9333ea','#16a34a','#dc2626','#d97706'];
function avatarColor(name) { var i=0; for(var c of name){i+=c.charCodeAt(0);} return avatarColors[i%avatarColors.length]; }

api.get('/admin/users').then(function(d) {
  var users = d.users;
  document.getElementById('user-count').textContent = users.length + ' users';

  document.getElementById('users-table').innerHTML = users.length ? users.map(function(u) {
    var dt = new Date(u.created_at).toLocaleDateString('en-PK');
    var roleTag = u.role==='admin'
      ? '<span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.1);color:#fca5a5;">Admin</span>'
      : '<span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.1);color:#93c5fd;">Client</span>';
    var statusTag = u.is_active!==false
      ? '<span class="flex items-center gap-1.5 text-green-400 text-xs"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;"></span>Active</span>'
      : '<span class="flex items-center gap-1.5 text-red-400 text-xs"><span style="width:6px;height:6px;border-radius:50%;background:#ef4444;display:inline-block;"></span>Inactive</span>';
    var av = '<div class="avatar" style="background:'+avatarColor(u.name)+'20;border:1px solid '+avatarColor(u.name)+'40;color:'+avatarColor(u.name)+';">'+initials(u.name)+'</div>';
    return '<tr><td><div class="flex items-center gap-3">'+av+'<div class="text-white font-medium text-sm">'+u.name+'</div></div></td>' +
      '<td class="text-[#8BA4C8] text-xs">'+u.email+'</td>' +
      '<td class="text-[#8BA4C8] text-xs">'+(u.company||'—')+'</td>' +
      '<td>'+roleTag+'</td><td>'+statusTag+'</td>' +
      '<td class="text-[#8BA4C8] text-xs whitespace-nowrap">'+dt+'</td></tr>';
  }).join('') : '<tr><td colspan="6" class="text-center py-10 text-[#8BA4C8]">No users found.</td></tr>';

  document.getElementById('user-cards').innerHTML = users.length ? users.map(function(u) {
    var roleTag = u.role==='admin'
      ? '<span style="display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.1);color:#fca5a5;">Admin</span>'
      : '<span style="display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.1);color:#93c5fd;">Client</span>';
    return '<div class="service-card p-4 flex items-start gap-3">' +
      '<div class="avatar mt-0.5" style="background:'+avatarColor(u.name)+'20;border:1px solid '+avatarColor(u.name)+'40;color:'+avatarColor(u.name)+';">'+initials(u.name)+'</div>' +
      '<div class="flex-1 min-w-0">' +
        '<div class="flex items-center justify-between gap-2"><div class="text-white font-semibold text-sm truncate">'+u.name+'</div>'+roleTag+'</div>' +
        '<div class="text-[#8BA4C8] text-xs mt-0.5 truncate">'+u.email+'</div>' +
        '<div class="text-[#8BA4C8] text-xs mt-0.5">'+(u.company||'—')+'</div>' +
        '<div class="mt-2 flex items-center justify-between">' +
          '<span class="text-'+(u.is_active!==false?'green':'red')+'-400 text-xs">'+(u.is_active!==false?'● Active':'● Inactive')+'</span>' +
          '<span class="text-[#8BA4C8] text-xs">'+new Date(u.created_at).toLocaleDateString('en-PK')+'</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="service-card p-5 text-center text-[#8BA4C8] text-sm">No users found.</div>';
}).catch(function() {
  document.getElementById('users-table').innerHTML = '<tr><td colspan="6" class="text-center py-10 text-red-400">Failed to load.</td></tr>';
  document.getElementById('user-cards').innerHTML = '<div class="service-card p-5 text-center text-red-400 text-sm">Failed to load.</div>';
});
</script>
</body>
</html>
