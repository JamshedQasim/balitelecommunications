<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Leads — Admin | BaliTelecom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#8BA4C8;font-size:14px;transition:all .15s;cursor:pointer;text-decoration:none;}
    .nav-item:hover{color:#fff;background:rgba(255,255,255,0.06);}
    .nav-item.active{color:#fff;background:rgba(24,95,165,0.35);border:1px solid rgba(24,95,165,0.3);}
    .nav-item svg{flex-shrink:0;width:16px;height:16px;}
    .admin-table th{padding:12px 16px;font-size:11px;font-weight:600;color:#8BA4C8;text-align:left;border-bottom:1px solid rgba(255,255,255,0.07);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;}
    .admin-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
    .admin-table tr:last-child td{border-bottom:none;}
    .admin-table tr:hover td{background:rgba(255,255,255,0.015);}
    .lead-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid;text-transform:capitalize;}
    .filter-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,0.1);color:#8BA4C8;transition:all .15s;cursor:pointer;background:transparent;}
    .filter-btn.active,.filter-btn:hover{color:#fff;background:rgba(24,95,165,0.3);border-color:rgba(24,95,165,0.5);}
    .detail-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
    .detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);}
    .detail-card{position:relative;z-index:1;background:#0A1628;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
  </style>
</head>
<body class="network-bg min-h-screen">

<div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden" onclick="closeSidebar()"></div>

<aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-[#05090F] border-r border-white/10 flex flex-col z-50 -translate-x-full lg:translate-x-0 transition-transform duration-300">
  <div class="p-5 border-b border-white/10 flex items-center gap-3">
    <div class="w-9 h-9 bg-gradient-to-br from-[#185FA5] to-[#2580E8] rounded-xl flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/></svg>
    </div>
    <div><div class="text-white font-bold text-sm" style="font-family:Syne,sans-serif;">BaliTelecom</div><div class="text-red-400 text-xs font-bold tracking-widest">ADMIN</div></div>
  </div>
  <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
    <a href="/admin/index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>Dashboard</a>
    <a href="/admin/leads.html" class="nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/></svg>Leads</a>
    <a href="/admin/tickets.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>Tickets</a>
    <a href="/admin/users.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Users</a>
    <a href="/admin/invoices.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Invoices</a>
    <a href="/admin/blog.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Blog Posts</a>
  </nav>
  <div class="p-3 border-t border-white/10 space-y-0.5">
    <a href="/pages/index.html" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>View Site</a>
    <button id="logout-btn" class="nav-item w-full text-left hover:text-red-400 hover:bg-red-500/5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</button>
  </div>
</aside>

<div class="lg:ml-64 flex flex-col min-h-screen">
  <header class="sticky top-0 z-30 bg-[#05090F]/95 backdrop-blur-sm border-b border-white/10 px-4 sm:px-6 py-3 flex items-center gap-3">
    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-[#8BA4C8] hover:text-white hover:bg-white/5">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div>
      <h1 class="text-white font-bold text-base sm:text-lg" style="font-family:Syne,sans-serif;">Leads</h1>
      <p class="text-[#8BA4C8] text-xs hidden sm:block">Manage quote requests and enquiries</p>
    </div>
    <div class="ml-auto text-[#8BA4C8] text-xs" id="lead-count"></div>
  </header>

  <main class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-6xl mx-auto space-y-4">

      <!-- Filters -->
      <div class="flex flex-wrap gap-2">
        <button class="filter-btn active" onclick="setFilter('')">All</button>
        <button class="filter-btn" onclick="setFilter('new')">New</button>
        <button class="filter-btn" onclick="setFilter('contacted')">Contacted</button>
        <button class="filter-btn" onclick="setFilter('converted')">Converted</button>
        <button class="filter-btn" onclick="setFilter('lost')">Lost</button>
      </div>

      <!-- Table (desktop) -->
      <div class="service-card overflow-hidden hidden sm:block">
        <div class="overflow-x-auto">
          <table class="admin-table w-full">
            <thead>
              <tr>
                <th>Name / Company</th>
                <th>Contact</th>
                <th>Service Interest</th>
                <th>Status</th>
                <th>Date</th>
                <th>Update</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody id="leads-table"><tr><td colspan="7" class="text-center py-10 text-[#8BA4C8]">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Cards (mobile) -->
      <div class="sm:hidden space-y-3" id="leads-cards"><div class="service-card p-5 text-center text-[#8BA4C8] text-sm">Loading...</div></div>

    </div>
  </main>
</div>

<!-- Detail modal -->
<div id="detail-modal" class="detail-modal hidden">
  <div class="detail-backdrop" onclick="closeDetail()"></div>
  <div class="detail-card">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-white font-bold text-lg" style="font-family:Syne,sans-serif;">Lead Details</h3>
      <button onclick="closeDetail()" class="text-[#8BA4C8] hover:text-white p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/main.js"></script>
<script>
if (!auth.isAdmin()) { window.location.href = '/pages/portal/login.html'; }
document.getElementById('logout-btn').addEventListener('click', auth.logout);
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden');}

var sc = {
  new:'bg-yellow-500/15 text-yellow-300 border-yellow-500/30',
  contacted:'bg-blue-500/15 text-blue-300 border-blue-500/30',
  converted:'bg-green-500/15 text-green-300 border-green-500/30',
  lost:'bg-red-500/15 text-red-300 border-red-500/30'
};
var currentFilter = '';
var allLeads = [];

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === (f||'all'));
  });
  renderLeads();
}

function renderLeads() {
  var leads = currentFilter ? allLeads.filter(function(l){return l.status===currentFilter;}) : allLeads;
  document.getElementById('lead-count').textContent = leads.length + ' leads';

  // Desktop table
  document.getElementById('leads-table').innerHTML = leads.length ? leads.map(function(l) {
    var dt = new Date(l.created_at).toLocaleDateString('en-PK');
    var badge = '<span class="lead-badge '+(sc[l.status]||'bg-gray-500/15 text-gray-300 border-gray-500/30')+'">'+l.status+'</span>';
    var sel = '<select onchange="updateStatus('+l.id+', this.value)" class="text-xs bg-[#0A1628] border border-white/10 text-[#8BA4C8] rounded-lg px-2 py-1.5 focus:outline-none focus:border-[#185FA5]"><option value="new" '+(l.status==='new'?'selected':'')+'>New</option><option value="contacted" '+(l.status==='contacted'?'selected':'')+'>Contacted</option><option value="converted" '+(l.status==='converted'?'selected':'')+'>Converted</option><option value="lost" '+(l.status==='lost'?'selected':'')+'>Lost</option></select>';
    return '<tr>' +
      '<td><div class="text-white font-semibold text-sm">'+l.name+'</div><div class="text-[#8BA4C8] text-xs mt-0.5">'+(l.company||'—')+'</div></td>' +
      '<td><div class="text-[#8BA4C8] text-xs">'+l.email+'</div><div class="text-[#8BA4C8] text-xs mt-0.5">'+(l.phone||'—')+'</div></td>' +
      '<td class="text-[#8BA4C8] text-xs">'+(l.service_interest||'—')+'</td>' +
      '<td>'+badge+'</td>' +
      '<td class="text-[#8BA4C8] text-xs whitespace-nowrap">'+dt+'</td>' +
      '<td>'+sel+'</td>' +
      '<td><button onclick=\'showDetail('+JSON.stringify(l).replace(/'/g,"\\'")+');\' class="text-xs text-[#4DA3FF] hover:underline whitespace-nowrap">View →</button></td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="7" class="text-center py-10 text-[#8BA4C8]">No leads found.</td></tr>';

  // Mobile cards
  document.getElementById('leads-cards').innerHTML = leads.length ? leads.map(function(l) {
    var dt = new Date(l.created_at).toLocaleDateString('en-PK');
    return '<div class="service-card p-4 space-y-3">' +
      '<div class="flex items-start justify-between gap-2">' +
        '<div><div class="text-white font-semibold">'+l.name+'</div><div class="text-[#8BA4C8] text-xs">'+(l.company||l.email)+'</div></div>' +
        '<span class="lead-badge '+(sc[l.status]||'bg-gray-500/15 text-gray-300 border-gray-500/30')+'">'+l.status+'</span>' +
      '</div>' +
      '<div class="grid grid-cols-2 gap-2 text-xs">' +
        '<div><span class="text-[#8BA4C8]">Service: </span><span class="text-white">'+(l.service_interest||'—')+'</span></div>' +
        '<div><span class="text-[#8BA4C8]">Date: </span><span class="text-white">'+dt+'</span></div>' +
      '</div>' +
      '<div class="flex items-center gap-2 pt-1 border-t border-white/5">' +
        '<select onchange="updateStatus('+l.id+', this.value)" class="flex-1 text-xs bg-[#0A1628] border border-white/10 text-[#8BA4C8] rounded-lg px-2 py-1.5 focus:outline-none"><option value="new" '+(l.status==='new'?'selected':'')+'>New</option><option value="contacted" '+(l.status==='contacted'?'selected':'')+'>Contacted</option><option value="converted" '+(l.status==='converted'?'selected':'')+'>Converted</option><option value="lost" '+(l.status==='lost'?'selected':'')+'>Lost</option></select>' +
        '<button onclick=\'showDetail('+JSON.stringify(l).replace(/'/g,"\\'")+');\' class="text-xs text-[#4DA3FF] border border-[#4DA3FF]/30 rounded-lg px-3 py-1.5">Details</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="service-card p-5 text-center text-[#8BA4C8] text-sm">No leads found.</div>';
}

function showDetail(l) {
  document.getElementById('detail-content').innerHTML =
    '<div class="space-y-3">' +
    row('Name', l.name) + row('Company', l.company||'—') + row('Email', l.email) +
    row('Phone', l.phone||'—') + row('Service', l.service_interest||'—') + row('Date', new Date(l.created_at).toLocaleDateString('en-PK')) +
    '</div>' +
    (l.message ? '<div class="mt-4 p-4 bg-white/5 rounded-xl"><div class="text-[#8BA4C8] text-xs mb-2 uppercase tracking-wider font-semibold">Message</div><p class="text-white text-sm leading-relaxed">'+l.message+'</p></div>' : '');
  document.getElementById('detail-modal').classList.remove('hidden');
}
function row(label, val) {
  return '<div class="flex justify-between gap-4 py-2 border-b border-white/5"><span class="text-[#8BA4C8] text-sm">'+label+'</span><span class="text-white text-sm font-medium text-right">'+val+'</span></div>';
}
function closeDetail() { document.getElementById('detail-modal').classList.add('hidden'); }

async function loadLeads() {
  try {
    var d = await api.get('/leads?limit=100');
    allLeads = d.leads;
    renderLeads();
  } catch(e) {
    var msg = e.message || 'Unknown error';
    document.getElementById('leads-table').innerHTML = '<tr><td colspan="7" class="text-center py-10 text-red-400">Failed to load: ' + msg + '</td></tr>';
    document.getElementById('leads-cards').innerHTML = '<div class="service-card p-5 text-center text-red-400 text-sm">Failed to load: ' + msg + '</div>';
  }
}

async function updateStatus(id, status) {
  try { await api.patch('/leads/'+id+'/status', {status}); loadLeads(); } catch(e) { alert('Failed: '+e.message); }
}
loadLeads();
</script>
</body>
</html>
